[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-reindexer"
version = "0.1.0"
description = "Reference-order molecular reindexing with hydrogen reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPLv3"}
authors = [
    {name = "Marta Chronowska", email = "mchrnwsk@gmail.com"}
]
maintainers = [
    {name = "Marta Chronowska", email = "mchrnwsk@gmail.com"}
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=1.5",
]

[project.urls]
Source = "https://github.com/wells-wood-research/reindexer"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]